[project]
name = "agent-research-crew"
version = "0.1.0"
description = "Multi-agent research team (planner, researchers, analyst, writer) producing cited market briefs"
readme = "README.md"
authors = [{ name = "Zaynab Zennour" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["anthropic", "pydantic", "python-dotenv", "rich"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_crew"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines are left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
research-crew = "research_crew.cli:main"
